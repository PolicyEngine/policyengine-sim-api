[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "policyengine-simulation-entry"
version = "0.1.0"
readme = "README.md"
authors = [
    {name = "PolicyEngine", email = "hello@policyengine.org"},
]
license = {file = "../../LICENSE"}
requires-python = ">=3.13,<3.14"
dependencies = [
    "cryptography>=41.0.0",
    "fastapi>=0.115.0,<1",
    "httpx>=0.28.0,<1",
    "policyengine-observability[fastapi]>=1.3.0,<2",
    "policyengine-simulation-contract",
    "policyengine-simulation-observability",
    "pyjwt>=2.10.1,<3",
    "uvicorn>=0.35.0,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/policyengine_simulation_entry"]

[tool.uv.sources]
policyengine-simulation-contract = { path = "../../libs/policyengine-simulation-contract", editable = true }
policyengine-simulation-observability = { path = "../../libs/policyengine-simulation-observability", editable = true }

[project.optional-dependencies]
test = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.3",
    "pytest-cov>=6.1.1",
]
build = [
    "openapi-python-client>=0.21.6",
    "pyright>=1.1.401",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.pyright]
include = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "policyengine-simulation-executor"
version = "0.1.0"
readme = "README.md"
authors = [
    {name = "PolicyEngine", email = "hello@policyengine.org"},
]
license = {file = "../../LICENSE"}
requires-python = ">=3.13,<3.14"
dependencies = [
    "opentelemetry-instrumentation-sqlalchemy (>=0.65b0,<0.66)",
    "pydantic-settings (>=2.7.1,<3.0.0)",
    "opentelemetry-instrumentation-fastapi (>=0.65b0,<0.66)",
    "policyengine-fastapi",
    "policyengine-simulation-observability",
    "policyengine-simulation-contract[modal]",
    "policyengine-stage12-persistence",
    # PolicyEngine.py's models extra is the only selector for core, country
    # models, and the SPM calculator. Do not duplicate those versions here.
    "policyengine[models]==6.2.6",
    "tables>=3.10.2",
    "modal>=0.73.0",
    "policyengine-observability[fastapi,google,otlp-grpc]>=3.0.2,<4",
    # Imported directly by the artifact store client; do not rely on the
    # transitive pin via policyengine.
    "google-cloud-storage>=2",
    # Imported directly by the UK private-data credential verifier.
    "huggingface-hub>=1,<2",
    "pyarrow>=20,<24",
]

[tool.hatch.build.targets.wheel]
packages = ["src/policyengine_simulation_executor"]

# Modal image bootstrap. Resolved inside uv.lock together with the
# project; the image installs it directly with
# uv_sync(--only-group modal-simulation-image, frozen=True), so image
# packages can only change through a relock and always match the
# versions the test environment runs against. PolicyEngine.py's models extra
# declares its exact core, country-model, and SPM calculator versions; uv.lock
# records the complete resolved environment. The bundle command only downloads
# certified datasets and writes their receipt.
[dependency-groups]
modal-simulation-image = [
    "policyengine[models]==6.2.6",
    "fastapi>=0.115.0",
    "tables>=3.10.2",
    "policyengine-observability[fastapi,google,otlp-grpc]>=3.0.2,<4",
    # The artifact fetch layer and store client read GCS. The lib is also a
    # transitive dependency of policyengine, but the image must not depend
    # on an upstream package keeping it.
    "google-cloud-storage>=2",
    # The CI credential-validation command imports this directly.
    "huggingface-hub>=1,<2",
    "pyarrow>=20,<24",
    # The Stage 12 coordinator and child functions use typed SQLAlchemy Core
    # DML against the API-owned temporary tables. These dependencies are
    # explicit because only this group is installed in Modal.
    "sqlalchemy>=2,<3",
    "psycopg[binary]>=3.2,<4",
]
# The executor's budget-window scheduler tests exercise the gateway app
# end-to-end; the gateway project rides in as a dev-only path dependency.
dev = [
    "policyengine-simulation-gateway",
]

[tool.uv.sources]
policyengine-fastapi = { path = "../../libs/policyengine-fastapi", editable = true }
policyengine-simulation-observability = { path = "../../libs/policyengine-simulation-observability", editable = true }
policyengine-simulation-contract = { path = "../../libs/policyengine-simulation-contract", editable = true }
policyengine-stage12-persistence = { path = "../../libs/policyengine-stage12-persistence", editable = true }
policyengine-simulation-gateway = { path = "../policyengine-simulation-gateway", editable = true }

[project.optional-dependencies]
test = [ "pytest>=8.3.4", "pytest-asyncio>=0.25.3", "pytest-cov>=6.1.1",]
build = [ "pyright>=1.1.401", "black>=25.1.0", "openapi-python-client>=0.21.6",]

[tool.pytest.ini_options]
pythonpath = [
  "src",
]

testpaths = ["tests"]

# Skip real-Modal integration smoke tests unless the operator explicitly
# opts in with ``-m integration``. The default test run stays hermetic.
addopts = "-m 'not integration'"
markers = [
  "integration: runs against a real (ephemeral) Modal deployment",
]

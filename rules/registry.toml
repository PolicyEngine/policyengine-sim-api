# --- Process and repository hygiene ----------------------------------------

[[rule]]
id = "sim.process.rules-registry"
category = "process"
statement = "Every rule is registered in rules/registry.toml, is enforced where it claims to be, and its rendered views are current."
rationale = "docs/engineering/skills/rules-registry.md"
scope = ["rules/registry.toml"]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "quality-guard"
name = "rules-registry"
[[rule.ci]]
workflow = ".github/workflows/pr.yml"
job = "quality-guards"
invocation = "run_quality_guards.py"

[[rule]]
id = "sim.process.stacked-prs-full-ci-at-bottom"
category = "process"
statement = "In a stack of pull requests, only the lowest unmerged one runs the full PR workflow and the Modal image smoke. Every pr.yml job is needed by the CI complete gate, which fails on the pull requests above it and otherwise passes only when every job passed, so a stack merges bottom-up and nothing merges untested."
rationale = "docs/engineering/skills/github-prs.md#stacked-prs-and-ci"
scope = [".github/workflows/pr.yml", ".github/workflows/pr-image-smoke.yml", ".github/scripts/check_ci_complete.sh"]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "pytest"
project = "projects/policyengine-simulation-executor"
nodes = ["tests/test_ci_complete_gate.py::test_pr_workflow_is_gated", "tests/test_ci_complete_gate.py::test_image_smoke_runs_only_at_the_bottom_of_a_stack"]
[[rule.ci]]
workflow = ".github/workflows/pr.yml"
job = "test"
invocation = "uv run --frozen pytest tests/"
[[rule.ci]]
workflow = ".github/workflows/pr.yml"
job = "ci-complete"
invocation = "check_ci_complete.sh"
[rule.proof]
bad_fixture = "rules/fixtures/sim.process.stacked-prs-full-ci-at-bottom/bad_pr.yml"
good_fixture = "rules/fixtures/sim.process.stacked-prs-full-ci-at-bottom/good_pr.yml"
project = "projects/policyengine-simulation-executor"
test = "tests/test_ci_complete_gate.py::test_rule_proof_gate_check"

[[rule]]
id = "sim.process.rule-machinery-code-owned"
category = "process"
statement = "Changes to the rule machinery (rules/, scripts/rules/, scripts/run_quality_guards.py and CODEOWNERS) need approval from a core developer other than the author. This is a team convention that GitHub doesn't enforce: the default branch's ruleset needs one approving review from anyone with write access and doesn't require code-owner review."
rationale = ".github/CODEOWNERS"
scope = [".github/CODEOWNERS"]
tier = "mechanical"
status = "doc-only"
autofix = false
[rule.enforcer]
kind = "none"

[[rule]]
id = "sim.process.agents-never-bypass"
category = "process"
statement = "Agents never bypass branch rules, even with admin credentials: no gh pr merge --admin and no bypass option; a blocked merge is reported to a human."
rationale = "docs/engineering/skills/github-prs.md#branch-rules"
scope = ["AGENTS.md"]
tier = "mechanical"
status = "doc-only"
autofix = false
[rule.enforcer]
kind = "none"

[[rule]]
id = "sim.agents.adapters-point-to-agents-md"
category = "process"
statement = "CLAUDE.md and .github/copilot-instructions.md only point to AGENTS.md; skills and rules are listed in AGENTS.md alone."
rationale = "AGENTS.md"
scope = ["CLAUDE.md", ".github/copilot-instructions.md"]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "quality-guard"
name = "rules-registry"
[[rule.ci]]
workflow = ".github/workflows/pr.yml"
job = "quality-guards"
invocation = "run_quality_guards.py"
[rule.proof]
bad_fixture = "scripts/rules/tests/fixtures/adapters/bad_CLAUDE.md"
good_fixture = "scripts/rules/tests/fixtures/adapters/good_CLAUDE.md"
test = "scripts/rules/tests/test_adapters.py::TestAdaptersProof::test_rule_proof_adapters"
workflow = ".github/workflows/pr.yml"
job = "quality-guards"
invocation = "unittest discover -s scripts/rules/tests"

[[rule]]
id = "sim.process.pr-tracking-issue"
category = "process"
statement = "The first line of every PR's description is Fixes #ISSUE_NUMBER, naming an open issue, not a pull request, in this repository; automated PRs open or reuse such an issue."
rationale = "docs/engineering/skills/github-prs.md#the-fixes-line"
scope = [".github/pull_request_template.md", ".github/workflows/pr-description.yml", ".github/scripts/check_pr_description.py", ".github/scripts/dependency-update-create-pr.sh", ".github/scripts/update-policyengine-package.sh"]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "workflow-job"
step = "Check the first line and the tracking issue"
[[rule.ci]]
workflow = ".github/workflows/pr-description.yml"
job = "pr-description"
invocation = "check_pr_description.py"
[rule.proof]
bad_fixture = "rules/fixtures/sim.process.pr-tracking-issue/bad_event.json"
good_fixture = "rules/fixtures/sim.process.pr-tracking-issue/good_event.json"
project = "projects/policyengine-simulation-entry"
test = "tests/test_pr_description_check.py::test_rule_proof_pr_tracking_issue"
workflow = ".github/workflows/pr.yml"
job = "test"
invocation = "uv run --frozen pytest tests/"

[[rule]]
id = "sim.process.same-repo-draft-prs"
category = "process"
statement = "PRs are opened as drafts from branches in PolicyEngine/policyengine-sim-api, never from forks."
rationale = "docs/engineering/skills/github-prs.md"
scope = [".github/pull_request_template.md"]
tier = "mechanical"
status = "doc-only"
autofix = false
[rule.enforcer]
kind = "none"

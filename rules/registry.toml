# --- Dependency locking -----------------------------------------------------

[[rule]]
id = "sim.dependencies.lock-committed"
category = "dependencies"
statement = "Every project directory with a pyproject.toml commits a uv.lock that matches it, and PR CI checks every lock with uv lock --check."
rationale = "docs/engineering/skills/dependencies.md#we-use-uvlock"
scope = ["projects/*/pyproject.toml", "libs/*/pyproject.toml", "projects/*/uv.lock", "libs/*/uv.lock"]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "quality-guard"
name = "locked-installs"
[[rule.ci]]
workflow = ".github/workflows/pr.yml"
job = "quality-guards"
invocation = "run_quality_guards.py"
[[rule.ci]]
workflow = ".github/workflows/pr.yml"
job = "test-integration"
invocation = "check-uv-locks.sh"
[rule.proof]
bad_fixture = "scripts/rules/tests/fixtures/locked_installs/lock_bad"
good_fixture = "scripts/rules/tests/fixtures/locked_installs/lock_good"
test = "scripts/rules/tests/test_locked_installs.py::TestLockedInstallsProof::test_rule_proof_lock_committed"
workflow = ".github/workflows/pr.yml"
job = "quality-guards"
invocation = "unittest discover -s scripts/rules/tests"

[[rule]]
id = "sim.dependencies.install-from-lock"
category = "dependencies"
statement = "Every install of a project's Python dependencies, in workflows and the scripts they run, Makefiles, Dockerfiles, Compose files and Modal image definitions, installs exactly the locked versions (uv sync --frozen, uv run --frozen, Modal uv_sync(frozen=True)); any other install is a registered exception for that one site."
rationale = "docs/engineering/skills/dependencies.md#we-install-from-uvlock"
scope = [".github/workflows/*.yml", ".github/scripts/*.sh", "scripts/*.sh", "Makefile", "projects/*/Dockerfile", "projects/*/src/**/*.py"]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "quality-guard"
name = "locked-installs"
[[rule.ci]]
workflow = ".github/workflows/pr.yml"
job = "quality-guards"
invocation = "run_quality_guards.py"
[rule.proof]
bad_fixture = "scripts/rules/tests/fixtures/locked_installs/install_bad"
good_fixture = "scripts/rules/tests/fixtures/locked_installs/install_good"
test = "scripts/rules/tests/test_locked_installs.py::TestLockedInstallsProof::test_rule_proof_install_from_lock"
workflow = ".github/workflows/pr.yml"
job = "quality-guards"
invocation = "unittest discover -s scripts/rules/tests"

[[rule.exception]]
path = ".github/workflows/pr.yml"
match = "uv tool install ruff==0.15.22"
category = "pinned-tool"
reason = "ruff is a repository-wide tool with no project of its own; ruff.toml sits at the root, which has no pyproject.toml or uv.lock, so the lint job installs the exact version ruff.toml is written for."

[[rule.exception]]
path = ".github/workflows/pr.yml"
match = "pip install shellcheck-py==0.11.0.1"
category = "pinned-tool"
reason = "shellcheck is a binary the ci-scripts guard runs; the quality-guards job has no project environment, so it installs the exact shellcheck-py release."

[[rule.exception]]
path = "Makefile"
match = "uv tool run ruff@$(RUFF_VERSION)"
category = "pinned-tool"
reason = "make format and make check run the ruff release pr.yml pins (RUFF_VERSION is read from its uv tool install ruff==<version>), outside any project, so local results match the lint job."

[[rule.exception]]
path = ".github/scripts/update-policyengine-package.sh"
match = "--with ${PACKAGE}==${LATEST}"
category = "pinned-tool"
reason = "The bundle updater reads the bundle versions of the PolicyEngine release it is about to lock, in an isolated environment outside any project; the release is pinned exactly and is not in any uv.lock yet."

[[rule]]
id = "sim.dependencies.test-from-lock"
category = "dependencies"
statement = "Every test command (pytest, coverage run, python -m unittest) in workflows, scripts, Makefiles, Dockerfiles and Compose files runs through uv run --frozen, in the project's locked environment; any other test run is a registered exception for that one site."
rationale = "docs/engineering/skills/dependencies.md#we-test-from-uvlock"
scope = [".github/workflows/*.yml", ".github/scripts/*.sh", "scripts/*.sh", "Makefile"]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "quality-guard"
name = "locked-installs"
[[rule.ci]]
workflow = ".github/workflows/pr.yml"
job = "quality-guards"
invocation = "run_quality_guards.py"
[rule.proof]
bad_fixture = "scripts/rules/tests/fixtures/locked_installs/test_bad"
good_fixture = "scripts/rules/tests/fixtures/locked_installs/test_good"
test = "scripts/rules/tests/test_locked_installs.py::TestLockedInstallsProof::test_rule_proof_test_from_lock"
workflow = ".github/workflows/pr.yml"
job = "quality-guards"
invocation = "unittest discover -s scripts/rules/tests"

[[rule.exception]]
path = ".github/workflows/pr.yml"
match = "python -m unittest discover -s scripts/rules/tests"
reason = "The rules tool under scripts/rules uses only the standard library and is not a project: the repository root has no pyproject.toml or uv.lock, so there is no locked environment to run its tests in."
removal = "scripts/rules gains a pyproject.toml and uv.lock, or a third-party dependency"

[[rule]]
id = "sim.dependencies.scheduled-relock"
category = "dependencies"
statement = "A scheduled workflow relocks every project's uv.lock with upgrades (uv lock --upgrade) and opens or updates a pull request with the result."
rationale = "docs/engineering/skills/dependencies.md#we-relock-automatically"
scope = [".github/workflows/update-dependencies.yml", "Makefile"]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "quality-guard"
name = "locked-installs"
[[rule.ci]]
workflow = ".github/workflows/pr.yml"
job = "quality-guards"
invocation = "run_quality_guards.py"
[rule.proof]
bad_fixture = "scripts/rules/tests/fixtures/locked_installs/relock_bad"
good_fixture = "scripts/rules/tests/fixtures/locked_installs/relock_good"
test = "scripts/rules/tests/test_locked_installs.py::TestLockedInstallsProof::test_rule_proof_scheduled_relock"
workflow = ".github/workflows/pr.yml"
job = "quality-guards"
invocation = "unittest discover -s scripts/rules/tests"


tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "pytest"
project = "projects/policyengine-simulation-entry"
nodes = [
  "tests/test_deployment_assets.py::test_main_deployment_automatically_deploys_stage12_in_both_environments",
  "tests/test_deployment_assets.py::test_stage12_only_deployment_runs_candidate_tests_and_requested_promotion",
  "tests/test_deployment_assets.py::test_stage12_only_deployment_cannot_redeploy_existing_modal_resources",
  "tests/test_deployment_assets.py::test_stage12_only_deployment_skips_existing_stack_integration_suite",
  "tests/test_deployment_assets.py::test_stage12_worker_deployment_can_request_a_google_oidc_token",
  "tests/test_deployment_assets.py::test_stage12_only_promotion_runs_whatever_the_skipped_stack_jobs",
]
[[rule.ci]]
workflow = ".github/workflows/pr.yml"
job = "test"
invocation = "uv run --frozen pytest tests/"

[[rule]]
id = "sim.stage12.production-lock-has-db-runtime"
category = "stage12"
statement = "The production lock file includes the direct Stage 12 database runtime dependencies."
rationale = "libs/policyengine-stage12-persistence/README.md"
scope = ["projects/policyengine-simulation-entry/uv.lock"]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "pytest"
project = "projects/policyengine-simulation-entry"
nodes = ["tests/test_deployment_assets.py::test_production_lock_contains_the_direct_stage12_database_runtime"]
[[rule.ci]]
workflow = ".github/workflows/pr.yml"
job = "test"
invocation = "uv run --frozen pytest tests/"


tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "ruff"
mode = "per-file-ignore"
pattern = "scripts/rules/tests/**"
codes = ["PT"]
[[rule.ci]]
workflow = ".github/workflows/pr.yml"
job = "lint"
invocation = "ruff check ."
[[rule]]
id = "sim.quality.deployed-tests-ruff-exemptions"
category = "quality"
statement = "The deployed-service test suite (projects/*/authenticated_tests, pytest run against a live candidate) gets the same ruff exemptions as unit tests (sim.quality.tests-ruff-exemptions); every other ruff rule applies to it."
rationale = "docs/engineering/skills/rules-registry.md#file-level-exceptions"
scope = ["projects/*/authenticated_tests/**/*.py"]
tier = "mechanical"
status = "enforced"
autofix = false

tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "pytest"
project = "projects/policyengine-simulation-entry"
nodes = ["tests/test_deployment_assets.py::test_deployment_scripts_have_valid_shell_syntax"]
[[rule.ci]]
workflow = ".github/workflows/pr.yml"
job = "test"
invocation = "uv run pytest tests/"

[[rule]]
id = "sim.deploy.gcloud-without-terraform"
category = "deployment"
statement = "Deployment uses the gcloud-based workflow, not Terraform."
rationale = "docs/operations"
scope = [".github/workflows/*.yml"]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "pytest"
project = "projects/policyengine-simulation-entry"
nodes = ["tests/test_deployment_assets.py::test_deployment_uses_gcloud_workflow_without_terraform"]
[[rule.ci]]
workflow = ".github/workflows/pr.yml"
job = "test"
invocation = "uv run pytest tests/"

[[rule]]
id = "sim.deploy.workflow-shell-safety"
category = "deployment"
statement = "Cloud Run deployment never interpolates GitHub expressions into shell, escapes environment values, and pins secret versions."
rationale = "docs/operations"
scope = [".github/workflows/*.yml"]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "pytest"
project = "projects/policyengine-simulation-entry"
nodes = [
  "tests/test_deployment_assets.py::test_cloud_run_deployment_does_not_interpolate_github_values_in_shell",
  "tests/test_deployment_assets.py::test_cloud_run_deployment_escapes_environment_and_pins_secret_versions",
]
[[rule.ci]]
workflow = ".github/workflows/pr.yml"
job = "test"
invocation = "uv run pytest tests/"

[[rule]]
id = "sim.deploy.revision-tags-valid"
category = "deployment"
statement = "Cloud Run revision tags are valid on a workflow's first run and fit the existing service names."
rationale = "docs/operations"
scope = [".github/workflows/*.yml"]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "pytest"
project = "projects/policyengine-simulation-entry"
nodes = [
  "tests/test_deployment_assets.py::test_cloud_run_revision_tags_are_valid_on_the_first_workflow_run",
  "tests/test_deployment_assets.py::test_revision_tags_fit_existing_cloud_run_service_names",
]
[[rule.ci]]
workflow = ".github/workflows/pr.yml"
job = "test"
invocation = "uv run pytest tests/"

[[rule]]
id = "sim.deploy.promotion-order-explicit"
category = "deployment"
statement = "Full-stack promotion order is explicit, and the reusable deployment rejects unexpectedly skipped phases."
rationale = "docs/operations"
scope = [".github/workflows/*.yml"]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "pytest"
project = "projects/policyengine-simulation-entry"
nodes = [
  "tests/test_deployment_assets.py::test_full_stack_promotion_order_is_explicit",
  "tests/test_deployment_assets.py::test_reusable_deployment_rejects_unexpected_skipped_phases",
]
[[rule.ci]]
workflow = ".github/workflows/pr.yml"
job = "test"
invocation = "uv run pytest tests/"

[[rule]]
id = "sim.deploy.smoke-tests-strict"
category = "deployment"
statement = "Candidate and stable smoke tests reject a revision mismatch without retrying, and fail if the previous revision does not converge."
rationale = "docs/operations"
scope = [".github/scripts/*.sh"]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "pytest"
project = "projects/policyengine-simulation-entry"
nodes = [
  "tests/test_deployment_assets.py::test_candidate_smoke_rejects_a_revision_mismatch_without_retrying",
  "tests/test_deployment_assets.py::test_stable_smoke_rejects_an_unexpected_revision_without_retrying",
  "tests/test_deployment_assets.py::test_stable_smoke_retries_the_previous_revision_until_target_is_served",
  "tests/test_deployment_assets.py::test_stable_smoke_fails_when_the_previous_revision_does_not_converge",
]
[[rule.ci]]
workflow = ".github/workflows/pr.yml"
job = "test"
invocation = "uv run pytest tests/"

[[rule]]
id = "sim.deploy.traffic-changes-exact"
category = "deployment"
statement = "Traffic changes target an exact, validated revision, are reversible, and refuse to run over an intervening promotion."
rationale = "docs/operations"
scope = [".github/scripts/*.sh"]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "pytest"
project = "projects/policyengine-simulation-entry"
nodes = [
  "tests/test_deployment_assets.py::test_traffic_changes_are_exact_revision_validated_and_reversible",
  "tests/test_deployment_assets.py::test_traffic_change_refuses_an_intervening_promotion",
]
[[rule.ci]]
workflow = ".github/workflows/pr.yml"
job = "test"
invocation = "uv run pytest tests/"

[[rule]]
id = "sim.deploy.container-context-minimal"
category = "deployment"
statement = "Container builds exclude local environments and unrelated projects, and the entrypoint container builds for the requested target platform."
rationale = "docs/operations"
scope = ["projects/policyengine-simulation-entry/Dockerfile"]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "pytest"
project = "projects/policyengine-simulation-entry"
nodes = [
  "tests/test_deployment_assets.py::test_container_context_excludes_local_environments_and_unrelated_projects",
  "tests/test_deployment_assets.py::test_entrypoint_container_uses_requested_target_platform",
]
[[rule.ci]]
workflow = ".github/workflows/pr.yml"
job = "test"
invocation = "uv run pytest tests/"

[[rule]]
id = "sim.deploy.docker-images-build"
category = "deployment"
statement = "The simulation entry and executor Docker images build."
rationale = "docs/operations"
scope = ["projects/policyengine-simulation-entry/Dockerfile", "projects/policyengine-simulation-executor/Dockerfile"]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "workflow-job"
[[rule.ci]]
workflow = ".github/workflows/pr.yml"
job = "docker-build"
invocation = "docker/build-push-action"

[[rule]]
id = "sim.deploy.modal-image-smoke"
category = "deployment"
statement = "App entrypoints import inside the real Modal images before merge, whenever a library baked into an image changes."
rationale = ".github/workflows/pr-image-smoke.yml"
scope = ["projects/policyengine-simulation-executor/src/modal/**/*.py"]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "workflow-job"
[[rule.ci]]
workflow = ".github/workflows/pr-image-smoke.yml"
job = "image-smoke"
invocation = "modal-image-smoke.sh"

[[rule]]
id = "sim.deploy.image-smoke-covers-every-image-lib"
category = "deployment"
statement = "The image smoke path filter includes every library mounted into a Modal image; libs/policyengine-stage12-persistence is currently missing, so Stage 12-only changes skip the smoke."
rationale = ".github/workflows/pr-image-smoke.yml"
scope = [".github/workflows/pr-image-smoke.yml"]
tier = "mechanical"
status = "doc-only"
autofix = false
[rule.enforcer]
kind = "none"

# --- API contracts and integration ----------------------------------------

[[rule]]
id = "sim.contracts.gateway-openapi-golden"
category = "contracts"
statement = "The gateway's OpenAPI spec matches the checked-in golden file; regenerate it deliberately when the API changes."
rationale = "projects/policyengine-simulation-gateway/tests/test_openapi_golden.py"
scope = ["projects/policyengine-simulation-gateway/src/**/*.py"]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "pytest"
project = "projects/policyengine-simulation-gateway"
nodes = ["tests/test_openapi_golden.py::test_openapi_spec_matches_golden"]
[[rule.ci]]
workflow = ".github/workflows/pr.yml"
job = "test"
invocation = "uv run pytest tests/"

[[rule]]
id = "sim.contracts.regenerate-clients"
category = "contracts"
statement = "When public API schemas change, regenerate the clients and run the generated-client integration tests."
rationale = "docs/engineering/skills/testing.md#dependency-boundaries"
scope = ["projects/policyengine-simulation-entry/src/**/*.py"]
tier = "mechanical"
status = "doc-only"
autofix = false
[rule.enforcer]
kind = "none"

[[rule]]
id = "sim.contracts.local-integration"
category = "contracts"
statement = "Generated-client integration tests pass against the locally built services."
rationale = "docs/engineering/skills/testing.md#common-commands"
scope = ["projects/policyengine-apis-integ/tests/**/*.py"]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "workflow-job"
[[rule.ci]]
workflow = ".github/workflows/pr.yml"
job = "test-integration"
invocation = "uv run pytest tests/"

[[rule]]
id = "sim.contracts.full-integration-beta-only"
category = "contracts"
statement = "The complete integration suite runs against beta deployments only, never production."
rationale = "docs/engineering/skills/testing.md"
scope = [".github/workflows/*.yml"]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "pytest"
project = "projects/policyengine-simulation-entry"
nodes = ["tests/test_deployment_assets.py::test_complete_integration_suite_is_configured_for_beta_only"]
[[rule.ci]]
workflow = ".github/workflows/pr.yml"
job = "test"
invocation = "uv run pytest tests/"

[[rule]]
id = "sim.contracts.clients-publish-deployed-commit"
category = "contracts"
statement = "Client publication checks out the commit that was actually deployed."
rationale = "docs/operations"
scope = [".github/workflows/*.yml"]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "pytest"
project = "projects/policyengine-simulation-entry"
nodes = ["tests/test_deployment_assets.py::test_client_publication_checks_out_the_deployed_commit"]
[[rule.ci]]
workflow = ".github/workflows/pr.yml"
job = "test"
invocation = "uv run pytest tests/"

# --- Observability ---------------------------------------------------------

[[rule]]
id = "sim.observability.id-is-diagnostic-only"
category = "observability"
statement = "observability_id has diagnostic meaning only: never use it for idempotency, authorization, database identity, routing or business logic."
rationale = "docs/engineering/skills/observability.md#identifier-ownership"
scope = ["projects/*/src/**/*.py", "libs/*/src/**/*.py"]
tier = "mechanical"
status = "doc-only"
autofix = false
[rule.enforcer]
kind = "none"

[[rule]]
id = "sim.observability.header-transport-only"
category = "observability"
statement = "observability_id travels only in the X-PolicyEngine-Observability-Id header, never in a simulation JSON body, and polling never invents one."
rationale = "docs/engineering/skills/observability.md#http-transport"
scope = ["projects/*/src/**/*.py"]
tier = "mechanical"
status = "doc-only"
autofix = false
[rule.enforcer]
kind = "none"

[[rule]]
id = "sim.observability.registered-stages-only"
category = "observability"
statement = "Span names come from the stage plans in policyengine_simulation_observability.stages; runtime code never adds span-name string literals."
rationale = "docs/engineering/skills/observability.md#runtime-stages"
scope = ["projects/*/src/**/*.py"]
tier = "mechanical"
status = "doc-only"
autofix = false
[rule.enforcer]
kind = "none"

[[rule]]
id = "sim.observability.failures-never-break-requests"
category = "observability"
statement = "Invalid observability configuration fails at build or deploy time, and telemetry failures at runtime never fail a request or computation."
rationale = "docs/engineering/skills/observability.md#failure-behavior"
scope = ["libs/policyengine-simulation-observability/src/**/*.py"]
tier = "mechanical"
status = "doc-only"
autofix = false
[rule.enforcer]
kind = "none"

# --- Code quality and tests ------------------------------------------------

[[rule]]
id = "sim.quality.ruff-format-src"
category = "quality"
statement = "Source code under projects/*/src and libs/*/src is formatted with ruff format."
rationale = "docs/engineering/skills/testing.md#common-commands"
scope = ["projects/*/src/**/*.py", "libs/*/src/**/*.py"]
tier = "mechanical"
status = "enforced"
autofix = true
[rule.enforcer]
kind = "ruff"
mode = "format"
[[rule.ci]]
workflow = ".github/workflows/pr.yml"
job = "lint"
invocation = "ruff format --check"

[[rule]]
id = "sim.quality.ruff-format-tests"
category = "quality"
statement = "Test code is formatted with ruff format too; CI currently checks only src directories."
rationale = "docs/engineering/skills/testing.md#common-commands"
scope = ["projects/*/tests/**/*.py", "libs/*/tests/**/*.py"]
tier = "mechanical"
status = "doc-only"
autofix = true
[rule.enforcer]
kind = "none"

[[rule]]
id = "sim.quality.tests-pass"
category = "quality"
statement = "Each project's unit tests pass in its own locked environment."
rationale = "docs/engineering/skills/testing.md#canonical-layout"
scope = ["projects/*/tests/**/*.py", "libs/*/tests/**/*.py"]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "workflow-job"
[[rule.ci]]
workflow = ".github/workflows/pr.yml"
job = "test"
invocation = "uv run pytest tests/"

[[rule]]
id = "sim.quality.every-project-tested"
category = "quality"
statement = "Every project and library runs its tests in PR CI; libs/policyengine-fastapi is not yet in the test matrix."
rationale = "docs/engineering/skills/testing.md#canonical-layout"
scope = ["libs/policyengine-fastapi/**/*.py"]
tier = "mechanical"
status = "doc-only"
autofix = false
[rule.enforcer]
kind = "none"

# --- Process and repository hygiene ----------------------------------------

[[rule]]
id = "sim.process.rules-registry"
category = "process"
statement = "Every rule is registered in rules/registry.toml, is enforced where it claims to be, and its rendered views are current."
rationale = "docs/engineering/skills/rules-registry.md"
scope = ["rules/registry.toml"]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "quality-guard"
name = "rules-registry"
[[rule.ci]]
workflow = ".github/workflows/pr.yml"
job = "quality-guards"
invocation = "run_quality_guards.py"

[[rule]]
id = "sim.process.same-repo-draft-prs"
category = "process"
statement = "PRs are opened as drafts from branches in PolicyEngine/policyengine-sim-api, never from forks, and start with 'Fixes #<issue>'."
rationale = "docs/engineering/skills/github-prs.md"
scope = [".github/pull_request_template.md"]
tier = "mechanical"
status = "doc-only"
autofix = false
[rule.enforcer]
kind = "none"

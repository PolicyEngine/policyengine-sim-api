# Rules registry for policyengine-sim-api.
#
# Every rule that governs this repository is declared here: what it says, how
# mechanically it is enforced, where it runs in CI, and whether a checker has
# been proven to reject a bad example. `python -m scripts.rules guard` keeps this
# file honest; `python -m scripts.rules render` regenerates
# docs/generated/rules.md and the Rules block in AGENTS.md.
#
# How to add or change a rule: docs/engineering/skills/rules-registry.md

schema_version = 1
repo = "policyengine-sim-api"
tool_version = "0.1.0"

[[category]]
id = "boundaries"
title = "Service and package boundaries"

[[category]]
id = "stage12"
title = "Stage 12 persistence"

[[category]]
id = "deployment"
title = "Deployment pipeline"

[[category]]
id = "contracts"
title = "API contracts and integration"

[[category]]
id = "observability"
title = "Observability"

[[category]]
id = "quality"
title = "Code quality and tests"

[[category]]
id = "process"
title = "Process and repository hygiene"

[discovery]
workflows = [".github/workflows/pr.yml", ".github/workflows/pr-image-smoke.yml"]
guard_test_globs = [
  "projects/*/tests/test_*boundar*.py",
  "libs/*/tests/test_*boundar*.py",
  "projects/*/tests/test_*schema_authority*.py",
  "projects/policyengine-simulation-entry/tests/test_deployment_assets.py",
  "projects/policyengine-simulation-gateway/tests/test_openapi_golden.py",
]

# --- Service and package boundaries ----------------------------------------

[[rule]]
id = "sim.boundaries.gateway-executor-decoupled"
category = "boundaries"
statement = "The gateway and executor never import each other; they communicate only through the models and state helpers in policyengine-simulation-contract."
rationale = "libs/policyengine-simulation-contract/README.md"
scope = ["projects/policyengine-simulation-gateway/src/**/*.py", "projects/policyengine-simulation-executor/src/**/*.py"]
tier = "mechanical"
status = "doc-only"
autofix = false
[rule.enforcer]
kind = "none"

[[rule]]
id = "sim.boundaries.unit-tests-need-no-services"
category = "boundaries"
statement = "Unit tests never require real network credentials, Modal, Hugging Face, GCP or deployed services; those seams are mocked."
rationale = "docs/engineering/skills/testing.md#dependency-boundaries"
scope = ["projects/*/tests/**/*.py", "libs/*/tests/**/*.py"]
tier = "mechanical"
status = "doc-only"
autofix = false
[rule.enforcer]
kind = "none"

# --- Stage 12 persistence --------------------------------------------------

[[rule]]
id = "sim.stage12.no-schema-ddl"
category = "stage12"
statement = "Simulation runtimes and the Stage 12 persistence library contain no schema DDL (CREATE, ALTER, DROP or TRUNCATE of tables, types, schemas or databases, or create_all); policyengine-api owns the schema."
rationale = "libs/policyengine-stage12-persistence/README.md"
scope = ["libs/policyengine-stage12-persistence/src/**/*.py", "projects/policyengine-simulation-entry/src/**/*.py", "projects/policyengine-simulation-executor/src/**/*.py"]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "pytest"
project = "projects/policyengine-simulation-entry"
nodes = ["tests/test_stage12_schema_authority.py::test_simulation_runtimes_contain_no_schema_ddl"]
[[rule.ci]]
workflow = ".github/workflows/pr.yml"
job = "test"
invocation = "uv run pytest tests/"
[rule.proof]
bad_fixture = "rules/fixtures/sim.stage12.no-schema-ddl/bad_stage12_runtime.py"
good_fixture = "rules/fixtures/sim.stage12.no-schema-ddl/good_stage12_runtime.py"
project = "projects/policyengine-simulation-entry"
test = "tests/test_stage12_schema_authority.py::test_rule_proof_stage12_no_schema_ddl"

[[rule]]
id = "sim.stage12.no-migration-chain"
category = "stage12"
statement = "This repository has no schema migration chain (no Alembic); Stage 12 tables are migrated by policyengine-api."
rationale = "libs/policyengine-stage12-persistence/README.md"
scope = ["projects/*/src/**/*.py", "libs/*/src/**/*.py"]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "pytest"
project = "projects/policyengine-simulation-entry"
nodes = ["tests/test_stage12_schema_authority.py::test_simulation_repository_has_no_schema_migration_chain"]
[[rule.ci]]
workflow = ".github/workflows/pr.yml"
job = "test"
invocation = "uv run pytest tests/"

[[rule]]
id = "sim.stage12.no-production-user-associations"
category = "stage12"
statement = "Stage 12 runtime modules never create production user associations (user_simulations or user_reports)."
rationale = "libs/policyengine-stage12-persistence/README.md"
scope = ["projects/*/src/**/stage12_*.py", "libs/policyengine-stage12-persistence/src/**/*.py"]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "pytest"
project = "projects/policyengine-simulation-entry"
nodes = ["tests/test_stage12_schema_authority.py::test_stage12_runtime_cannot_create_production_user_associations"]
[[rule.ci]]
workflow = ".github/workflows/pr.yml"
job = "test"
invocation = "uv run pytest tests/"

[[rule]]
id = "sim.stage12.persistence-typed-dml-only"
category = "stage12"
statement = "The Stage 12 persistence library and runtime use typed SQLAlchemy Core DML only: no raw SQL text, driver-level SQL or schema operations."
rationale = "libs/policyengine-stage12-persistence/README.md"
scope = ["libs/policyengine-stage12-persistence/src/**/*.py"]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "pytest"
project = "libs/policyengine-stage12-persistence"
nodes = ["tests/test_source_boundaries.py::test_persistence_package_contains_no_raw_sql_or_schema_operations"]
[[rule.ci]]
workflow = ".github/workflows/pr.yml"
job = "test"
invocation = "uv run pytest tests/"

[[rule]]
id = "sim.stage12.deployment-uses-api-schema"
category = "stage12"
statement = "Stage 12 deployment uses the API-owned schema directly, and the Stage 12 runtime it deploys uses typed DML without raw SQL or schema changes."
rationale = "libs/policyengine-stage12-persistence/README.md"
scope = ["projects/policyengine-simulation-entry/src/**/*.py"]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "pytest"
project = "projects/policyengine-simulation-entry"
nodes = [
  "tests/test_deployment_assets.py::test_stage12_deployment_uses_the_api_owned_schema_directly",
  "tests/test_deployment_assets.py::test_stage12_runtime_uses_typed_dml_without_raw_sql_or_schema_changes",
]
[[rule.ci]]
workflow = ".github/workflows/pr.yml"
job = "test"
invocation = "uv run pytest tests/"

[[rule]]
id = "sim.stage12.deployment-scope"
category = "stage12"
statement = "Main-branch deploys roll out Stage 12 in both environments; a Stage 12-only deploy runs candidate tests and the requested promotion but never redeploys existing Modal resources; the Stage 12 worker can request a Google OIDC token."
rationale = "docs/operations"
scope = [".github/workflows/*.yml"]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "pytest"
project = "projects/policyengine-simulation-entry"
nodes = [
  "tests/test_deployment_assets.py::test_main_deployment_automatically_deploys_stage12_in_both_environments",
  "tests/test_deployment_assets.py::test_stage12_only_deployment_runs_candidate_tests_and_requested_promotion",
  "tests/test_deployment_assets.py::test_stage12_only_deployment_cannot_redeploy_existing_modal_resources",
  "tests/test_deployment_assets.py::test_stage12_worker_deployment_can_request_a_google_oidc_token",
]
[[rule.ci]]
workflow = ".github/workflows/pr.yml"
job = "test"
invocation = "uv run pytest tests/"

[[rule]]
id = "sim.stage12.production-lock-has-db-runtime"
category = "stage12"
statement = "The production lock file includes the direct Stage 12 database runtime dependencies."
rationale = "libs/policyengine-stage12-persistence/README.md"
scope = ["projects/policyengine-simulation-entry/uv.lock"]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "pytest"
project = "projects/policyengine-simulation-entry"
nodes = ["tests/test_deployment_assets.py::test_production_lock_contains_the_direct_stage12_database_runtime"]
[[rule.ci]]
workflow = ".github/workflows/pr.yml"
job = "test"
invocation = "uv run pytest tests/"

# --- Deployment pipeline ---------------------------------------------------

[[rule]]
id = "sim.deploy.shell-scripts-valid"
category = "deployment"
statement = "Deployment shell scripts have valid shell syntax."

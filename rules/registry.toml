tier = "mechanical"
status = "enforced"
autofix = true
[rule.enforcer]
kind = "ruff"
mode = "format"
[[rule.ci]]
workflow = ".github/workflows/pr.yml"
job = "lint"
invocation = "ruff format --check"

[[rule]]
id = "sim.quality.ruff-format-tests"
category = "quality"
statement = "Test code is formatted with ruff format too; CI currently checks only src directories."
rationale = "docs/engineering/skills/testing.md#common-commands"
scope = ["projects/*/tests/**/*.py", "libs/*/tests/**/*.py"]
tier = "mechanical"
status = "doc-only"
autofix = true
[rule.enforcer]
kind = "none"

[[rule]]
id = "sim.quality.ruff-lint"
category = "quality"
statement = "All Python code passes ruff check with every ruff rule selected (ALL), with no ratchet, except the ignores in ruff.toml: COM812 and ISC001, which conflict with ruff format, and D203 and D213, which conflict with the kept D211 and D212."
rationale = "docs/engineering/skills/rules-registry.md#baselines"
scope = ["projects/*/src/**/*.py", "libs/*/src/**/*.py", "projects/*/tests/**/*.py", "libs/*/tests/**/*.py"]
tier = "mechanical"
status = "enforced"
autofix = true
[rule.enforcer]
kind = "ruff"
mode = "lint"
codes = ["ALL"]
[[rule.ci]]
workflow = ".github/workflows/pr.yml"
job = "lint"
invocation = "ruff check ."

[[rule]]
id = "sim.quality.tests-ruff-exemptions"
category = "quality"
statement = "Test files may use pytest's bare assert, need no docstrings, annotations or named constants for magic numbers, and may reach into private members, live outside packages and import inside a test (S101, D1, ANN, PLR2004, SLF001, INP001, PLC0415). They may also run repository scripts (S603, S607) and use fake credentials (S105, S106), temporary paths (S108), naive datetimes (DTZ001, DTZ007), pickle (S301) and exec (S102), may import the lazily loaded packages at module level (TID253), and may leave arguments unused in fakes and stubs that mirror a real signature (ARG001, ARG002, ARG005). Every other ruff rule applies to tests."
rationale = "docs/engineering/skills/rules-registry.md#file-level-exceptions"
scope = ["projects/*/tests/**/*.py", "libs/*/tests/**/*.py", "scripts/rules/tests/**/*.py"]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "ruff"
mode = "per-file-ignore"
pattern = "**/tests/**"
codes = ["ANN", "ARG001", "ARG002", "ARG005", "D1", "DTZ001", "DTZ007", "INP001", "PLC0415", "PLR2004", "S101", "S102", "S105", "S106", "S108", "S301", "S603", "S607", "SLF001", "TID253"]
[[rule.ci]]
workflow = ".github/workflows/pr.yml"
job = "lint"
invocation = "ruff check ."


[[rule]]
id = "sim.quality.unittest-ruff-exemptions"
category = "quality"
statement = "The shared rules tool's tests use unittest, because the tool needs only the standard library, so ruff's pytest-style rules (PT) don't apply to them."
rationale = "docs/engineering/skills/rules-registry.md#baselines"

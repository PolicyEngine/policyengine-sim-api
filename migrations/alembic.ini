# The Simulation Entrypoint's only Alembic chain: the `simulation` schema.
# Run it from the persistence library's environment, for example:
#   uv run --frozen --project libs/policyengine-simulation-persistence --extra migrations \
#     alembic -c migrations/alembic.ini upgrade head
# The database URL comes only from SIMULATION_MIGRATION_DATABASE_URL.
# Ownership rules: libs/policyengine-simulation-persistence/README.md

[alembic]
script_location = %(here)s
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

# The locked environment Towncrier runs in. .github/scripts/build-changelog.sh
# runs it with `uv run --frozen --project .github/towncrier towncrier build`,
# so every release builds CHANGELOG.md with the Towncrier release in uv.lock.
# `make update` relocks it with every other project. This project is never
# built or installed as a package; the repository's release version is in
# VERSION, not here. See docs/engineering/skills/dependencies.md.

[project]
name = "policyengine-sim-api-towncrier"
version = "0.1.0"
description = "Towncrier, locked for building CHANGELOG.md from changelog.d/ fragments."
requires-python = ">=3.13,<3.14"
dependencies = ["towncrier>=26.9.0,<27"]

[tool.uv]
package = false

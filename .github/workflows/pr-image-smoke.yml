name: PR image smoke

# Import the true app entrypoints inside the real Modal images before
# merge (issue #602's class: image-only dependency breakage that unit
# tests in the locked env cannot see). Path-filtered to image inputs;
# skipped on fork PRs (no Modal secrets there) — those rely on the
# post-merge beta integration tests as before.

on:
  pull_request:
    branches: [main]
    paths:
      - 'projects/policyengine-simulation-gateway/**'
      - 'projects/policyengine-simulation-executor/uv.lock'
      - 'projects/policyengine-simulation-executor/pyproject.toml'
      - 'projects/policyengine-simulation-executor/src/modal/**'
      - 'projects/policyengine-simulation-executor/src/policyengine_simulation_executor/**'
      - 'libs/policyengine-simulation-contract/**'
      - 'libs/policyengine-simulation-observability/**'
      - 'libs/policyengine-fastapi/**'
      - 'libs/policyengine-stage12-persistence/**'
      - '.github/workflows/pr-image-smoke.yml'
      - '.github/scripts/modal-image-smoke.sh'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  image-smoke:
    name: Image smoke (staging)
    runs-on: ubuntu-latest
    # Same-repository pull requests only, and in a stack only the lowest
    # unmerged one (see docs/engineering/skills/github-prs.md).
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && (!github.event.pull_request.stack || github.event.pull_request.stack.base.ref == github.event.pull_request.base.ref) }}
    # Warm cache: a few minutes. After a relock the executor smoke and the
    # v2 image smoke each pay their certified dataset download layers
    # (~15-20 min each; Modal builds the v2 smoke's images together).
    timeout-minutes: 90

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'

    - name: Install uv
      uses: astral-sh/setup-uv@v8.1.0
      with:
        version: "0.13.6"
        enable-cache: true

    - name: Install credential validation dependencies
      working-directory: projects/policyengine-simulation-executor
      run: uv sync --frozen

    - name: Validate the GitHub UK private-data credential
      working-directory: projects/policyengine-simulation-executor
      env:
        HUGGING_FACE_TOKEN: ${{ secrets.PE_UK_PRIVATE_HF_READ_TOKEN }}
      run: uv run --frozen python -m src.modal.utils.validate_hf_access

    - name: Run image smokes
      env:
        MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
        MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        PE_UK_PRIVATE_HF_READ_TOKEN: ${{ secrets.PE_UK_PRIVATE_HF_READ_TOKEN }}
      run: .github/scripts/modal-image-smoke.sh staging

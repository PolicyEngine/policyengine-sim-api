name: PR checks

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ci-complete:
    # The required check. Needs every other job: on a stacked pull request
    # above the lowest unmerged one it fails, because those jobs were skipped
    # and a skipped job would count as passing; otherwise it passes only when
    # every job passed. See docs/engineering/skills/github-prs.md.
    name: CI complete
    if: ${{ always() }}
    needs: [test, simulation-database, lint, pyright, quality-guards, check-changelog, docker-build, test-integration]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout the gate script
      uses: actions/checkout@v6
      with:
        sparse-checkout: .github/scripts/check_ci_complete.sh
        sparse-checkout-cone-mode: false

    - name: Require full CI, with every job passing
      env:
        JOB_RESULTS: ${{ toJSON(needs) }}
        PULL_REQUEST_BASE_REF: ${{ github.event.pull_request.base.ref }}
        STACK_BASE_REF: ${{ github.event.pull_request.stack.base.ref }}
      run: bash .github/scripts/check_ci_complete.sh

  test:
    name: Test
    # Full CI runs only on the lowest unmerged pull request in a stack.
    if: ${{ !github.event.pull_request.stack || github.event.pull_request.stack.base.ref == github.event.pull_request.base.ref }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Each entry is a uv project tested in its own locked environment.
        # For the gateway this is the parity guarantee: the same lock the
        # Modal image installs with uv_sync(frozen=True).
        project:
          - projects/policyengine-simulation-executor
          - projects/policyengine-simulation-entry
          - projects/policyengine-simulation-gateway
          - libs/policyengine-simulation-contract
          - libs/policyengine-simulation-observability
          - libs/policyengine-simulation-persistence
          - libs/policyengine-stage12-persistence
          - libs/policyengine-fastapi

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'

    - name: Install uv
      uses: astral-sh/setup-uv@v8.1.0
      with:
        version: "0.13.6"
        enable-cache: true

    - name: Install dependencies
      working-directory: ${{ matrix.project }}
      run: uv sync --frozen --extra test

    - name: Run tests
      working-directory: ${{ matrix.project }}
      run: uv run --frozen pytest tests/ -v

  simulation-database:
    name: Simulation database
    # Runs the simulation schema's migration chain (upgrade, alembic check,
    # downgrade, upgrade) and the persistence tests that need a database, on a
    # fresh PostgreSQL. Full CI runs only on the lowest unmerged pull request
    # in a stack.
    if: ${{ !github.event.pull_request.stack || github.event.pull_request.stack.base.ref == github.event.pull_request.base.ref }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: simulation_ci
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      SIMULATION_TEST_DATABASE_URL: postgresql://postgres:simulation_ci@127.0.0.1:5432/postgres
      # A missing server fails the tests instead of skipping them.
      SIMULATION_REQUIRE_DATABASE_TESTS: "1"

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'

    - name: Install uv
      uses: astral-sh/setup-uv@v8.1.0
      with:
        version: "0.13.6"
        enable-cache: true

    - name: Install dependencies
      working-directory: libs/policyengine-simulation-persistence
      run: uv sync --extra test --frozen

    - name: Run the migration chain and persistence tests on PostgreSQL
      working-directory: libs/policyengine-simulation-persistence
      run: uv run --frozen pytest tests/ -v -m postgres

  lint:
    name: Lint
    # Full CI runs only on the lowest unmerged pull request in a stack.
    if: ${{ !github.event.pull_request.stack || github.event.pull_request.stack.base.ref == github.event.pull_request.base.ref }}
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'

    - name: Install uv
      uses: astral-sh/setup-uv@v8.1.0
      with:
        version: "0.13.6"

    - name: Install ruff
      # Pinned so a ruff release cannot change CI results; see ruff.toml.
      run: uv tool install ruff==0.15.22

    - name: Run ruff format check
      run: uv run --frozen ruff format --check projects/*/src libs/*/src

    - name: Run ruff check
      run: uv run --frozen ruff check .

  quality-guards:
    name: Quality guards
    # Full CI runs only on the lowest unmerged pull request in a stack.
    if: ${{ !github.event.pull_request.stack || github.event.pull_request.stack.base.ref == github.event.pull_request.base.ref }}
    runs-on: ubuntu-latest
    # The checkout reads the repository, and the rules guard looks up the
    # tracking issue of each [rule.downgrade] with the job's token.
    permissions:
      contents: read
      issues: read

    steps:
    - uses: actions/checkout@v6
      with:
        # The rules registry guard compares baselines with the base branch.
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'

    - name: Install uv (the Pyright check's tests run the pinned Pyright)
      uses: astral-sh/setup-uv@v8.1.0
      with:
        version: "0.13.6"

    - name: Test the rules registry tool
      run: python -m unittest discover -s scripts/rules/tests -t .

    - name: Install shellcheck (for the ci-scripts guard)
      run: pip install "shellcheck-py==0.11.0.1"

    - name: Run quality guards
      env:
        # Read by gh, which the rules guard runs to confirm that each
        # [rule.downgrade] names an open issue; without it the guard fails.
        GH_TOKEN: ${{ github.token }}
      run: python scripts/run_quality_guards.py

  check-changelog:
    # Rule sim.process.changelog-fragment: every pull request adds a changelog
    # fragment the release can read. See
    # docs/engineering/skills/github-prs.md#changelog-fragments.
    name: Changelog fragment
    # Full CI runs only on the lowest unmerged pull request in a stack.
    if: ${{ !github.event.pull_request.stack || github.event.pull_request.stack.base.ref == github.event.pull_request.base.ref }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v6
      with:
        # The check diffs the merged result against its merge base with the
        # base branch, so it needs the base branch's history.
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'

    - name: Require a changelog fragment
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: .github/scripts/check-changelog-fragment.sh

  pyright:
    name: Pyright
    # Full CI runs only on the lowest unmerged pull request in a stack.
    if: ${{ !github.event.pull_request.stack || github.event.pull_request.stack.base.ref == github.event.pull_request.base.ref }}
    runs-on: ubuntu-latest
    strategy:
      # Each package passes or fails on its own; report every one.
      fail-fast: false
      matrix:
        # Each entry is a uv package, type-checked in its own locked
        # environment with the Pyright version pinned in
        # scripts/rules/pyright.py. The Pyright rules in rules/registry.toml
        # list the same packages, and the rules guard fails when one is
        # missing here.
        package:
          - libs/policyengine-simulation-contract
          - libs/policyengine-simulation-observability
          - libs/policyengine-simulation-persistence
          - libs/policyengine-stage12-persistence
          - libs/policyengine-fastapi
          - projects/policyengine-simulation-entry
          - projects/policyengine-simulation-gateway
          - projects/policyengine-simulation-executor
          - projects/policyengine-apis-integ

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'

    - name: Install uv
      uses: astral-sh/setup-uv@v8.1.0
      with:
        version: "0.13.6"
        enable-cache: true

    - name: Generate API clients
      # apis-integ installs the generated client from its output directory.
      if: matrix.package == 'projects/policyengine-apis-integ'
      run: ./scripts/generate-clients.sh

    - name: Run Pyright in the package's locked environment
      env:
        PACKAGE: ${{ matrix.package }}
      run: python -m scripts.rules pyright --sync "$PACKAGE"

  docker-build:
    name: Docker build
    needs: [test, lint]  # Only run if tests and linting pass
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [simulation-entry, simulation-executor]

    steps:
    - uses: actions/checkout@v6

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: projects/policyengine-${{ matrix.service }}/Dockerfile
        push: false
        tags: policyengine-${{ matrix.service }}:test
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64

  test-integration:
    name: Test integration
    needs: docker-build  # Only run if docker builds succeed
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'

    - name: Install uv
      uses: astral-sh/setup-uv@v8.1.0
      with:
        version: "0.13.6"
        enable-cache: true

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Generate API clients
      run: |
        ./scripts/generate-clients.sh

    # After the clients exist: policyengine-apis-integ depends on the generated
    # client by path, so its lock can only be checked once it is generated.
    - name: Check every uv.lock matches its pyproject.toml
      run: .github/scripts/check-uv-locks.sh

    - name: Start services
      run: .github/scripts/start-local-services.sh deployment/docker-compose.yml

    - name: Install integration test dependencies
      working-directory: projects/policyengine-apis-integ
      run: uv sync --frozen --extra test

    - name: Run integration tests (local services only)
      working-directory: projects/policyengine-apis-integ
      # Run tests against local Docker services only (not Modal staging)
      run: uv run --frozen pytest tests/ -v -m "not requires_gcp and not beta_only"

    - name: Show service logs on failure
      if: failure()
      run: |
        docker compose -f deployment/docker-compose.yml logs

    - name: Stop services
      if: always()
      run: |
        docker compose -f deployment/docker-compose.yml down

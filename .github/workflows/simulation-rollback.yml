name: Roll back Simulation API

# Undo a release's Modal routing, or route unpinned requests back to a
# policyengine.py release that is already published, optionally move Cloud
# Run entrypoint traffic back to a retained revision, then verify the stable
# service serves the restored release.
#
# Three ways to restore routing (give exactly one):
# - resolve_pending_publication: print and restore the unfinished publication
#   from the durable routing journal, even when no artifact was uploaded.
# - deploy_run_id: restore exactly the routing state that deployment replaced,
#   from the plans it kept as artifacts: the routes plan and the latest plan
#   of each attempt whose routes job or latest job ran. A plan GitHub no longer lists
#   (its job reran later) may be missing only when the plans around it show
#   its change undone. Each change is undone only while the live
#   state is what it published, so it never overwrites a later release; the
#   failed release's routes go too.
# - policyengine_version: point latest at that published release. Other
#   releases, including the failed one, stay pinnable.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Environment to roll back"
        required: true
        type: choice
        options:
          - beta
          - prod
      deploy_run_id:
        description: "Deployment run whose saved routing plans to undo"
        required: false
        type: string
      resolve_pending_publication:
        description: "Print and restore the target's unfinished publication from its durable journal"
        required: false
        default: false
        type: boolean
      policyengine_version:
        description: "Published policyengine.py version to restore as latest"
        required: false
        type: string
      expected_latest:
        description: "With policyengine_version: refuse unless latest is currently this version"
        required: false
        type: string
      entrypoint_revision:
        description: "Retained Cloud Run revision to route to (blank: leave traffic)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # Serialize routing writes with both deployment workflows, including restores.
  group: simulation-deploy-main
  cancel-in-progress: false

jobs:
  rollback:
    name: Roll back ${{ inputs.target }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    environment: ${{ inputs.target }}
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      TARGET: ${{ inputs.target }}
      DEPLOY_RUN_ID: ${{ inputs.deploy_run_id }}
      RESOLVE_PENDING_PUBLICATION: ${{ inputs.resolve_pending_publication }}
      POLICYENGINE_VERSION: ${{ inputs.policyengine_version }}
      EXPECTED_LATEST: ${{ inputs.expected_latest }}
      ENTRYPOINT_REVISION: ${{ inputs.entrypoint_revision }}
      MODAL_ENVIRONMENT: ${{ inputs.target == 'prod' && 'main' || 'staging' }}
      SERVICE: ${{ inputs.target == 'prod' && 'policyengine-simulation-entry' || 'policyengine-simulation-entry-staging' }}
      REGION: ${{ vars.SIMULATION_ENTRYPOINT_GCP_REGION || 'us-central1' }}
      PROJECT_ID: ${{ vars.SIMULATION_ENTRYPOINT_GCP_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v6

      - name: Validate the requested rollback
        run: .github/scripts/validate-simulation-rollback-inputs.sh

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.13.6"

      - name: Install routing publisher dependencies
        working-directory: projects/policyengine-simulation-executor
        run: uv sync --frozen

      - name: Download the deployment's routing plans
        if: ${{ inputs.deploy_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.deploy_run_id }}
          github-token: ${{ github.token }}
          # Each attempt's routes plan (routing-plan-*) and latest plan
          # (routing-latest-plan-*).
          pattern: routing-*plan-${{ inputs.target }}-*
          path: ${{ runner.temp }}/routing-plans

      - name: Restore Modal routing
        if: ${{ !inputs.resolve_pending_publication }}
        working-directory: projects/policyengine-simulation-executor
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          GH_TOKEN: ${{ github.token }}
        run: ../../.github/scripts/rollback-restore-routing.sh

      - name: Resolve the unfinished routing publication
        if: ${{ inputs.resolve_pending_publication }}
        working-directory: projects/policyengine-simulation-executor
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: ../../.github/scripts/rollback-resolve-pending-publication.sh

      - name: Read the restored release identity
        if: ${{ !inputs.resolve_pending_publication }}
        id: identity
        working-directory: projects/policyengine-simulation-executor
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: ../../.github/scripts/rollback-read-release-identity.sh

      - uses: google-github-actions/auth@v2
        if: ${{ !inputs.resolve_pending_publication }}
        with:
          workload_identity_provider: ${{ secrets.SIMULATION_ENTRYPOINT_GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.SIMULATION_ENTRYPOINT_GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2
        if: ${{ !inputs.resolve_pending_publication }}

      - name: Resolve the stable service
        if: ${{ !inputs.resolve_pending_publication }}
        id: service
        run: .github/scripts/rollback-stable-service-state.sh

      - name: Restore entrypoint traffic
        if: ${{ inputs.entrypoint_revision != '' }}
        env:
          SIMULATION_ENTRYPOINT_GCP_PROJECT_ID: ${{ env.PROJECT_ID }}
          SIMULATION_ENTRYPOINT_GCP_REGION: ${{ env.REGION }}
          SIMULATION_ENTRYPOINT_SERVICE: ${{ env.SERVICE }}
          SIMULATION_ENTRYPOINT_TARGET_REVISION: ${{ inputs.entrypoint_revision }}
          SIMULATION_ENTRYPOINT_EXPECTED_CURRENT_REVISION: ${{ steps.service.outputs.revision }}
        run: .github/scripts/rollback-restore-entrypoint-traffic.sh

      - name: Verify the stable service serves the restored release
        if: ${{ !inputs.resolve_pending_publication }}
        env:
          # The whole identity latest now routes to, read from the registry;
          # a release from before dataset digests were recorded expects none.
          EXPECTED_IDENTITY: required
          EXPECTED_POLICYENGINE_VERSION: ${{ steps.identity.outputs.policyengine_version }}
          EXPECTED_APP_NAME: ${{ steps.identity.outputs.app_name }}
          EXPECTED_UK_MODEL_VERSION: ${{ steps.identity.outputs.uk_model_version }}
          EXPECTED_UK_DATASET_SHA256: ${{ steps.identity.outputs.uk_dataset_sha256 || 'unrecorded' }}
          EXPECTED_LATEST: "true"
          STABLE_URL: ${{ steps.service.outputs.url }}
          EXPECTED_REVISION: ${{ inputs.entrypoint_revision }}
          PREVIOUS_REVISION: ${{ steps.service.outputs.revision }}
        run: .github/scripts/rollback-verify-stable-service.sh

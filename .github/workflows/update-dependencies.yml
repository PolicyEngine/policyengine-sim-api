name: Update dependencies

on:
  schedule:
    # Run daily at 3:00 PM US Eastern time.
    - cron: '0 15 * * *'
      timezone: 'America/New_York'
  workflow_dispatch:  # Allow manual triggering

concurrency:
  group: update-dependencies
  cancel-in-progress: false

jobs:
  update-dependencies:
    name: File update PR
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # Rebuilds update-dependencies from main on every run, and records the
      # commit the remote branch points at for the push step's lease.
      - name: Prepare update branch
        id: branch
        run: .github/scripts/dependency-update-prepare-branch.sh
      
      - name: Generate API clients
        run: ./scripts/generate-clients.sh
      
      - name: Update dependencies
        run: make update

      - name: Commit and push update
        id: push
        env:
          REMOTE_HEAD: ${{ steps.branch.outputs.remote_head }}
        run: .github/scripts/dependency-update-commit-and-push.sh

      # Opens the update PR, or, when one is open, replaces its description,
      # whose first line names the tracking issue (rule
      # sim.process.pr-tracking-issue). It runs whenever the update changed
      # files on main, including when the branch already held them.
      - name: Open or update the pull request
        if: steps.push.outputs.changes_detected == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: .github/scripts/dependency-update-create-pr.sh

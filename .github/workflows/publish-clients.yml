name: Publish API clients

on:
  workflow_run:
    workflows: ["Deploy Simulation API"]
    types:
      - completed
    branches:
      - main


jobs:
  publish:
    name: Publish API clients
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
    - name: Checkout repo
      uses: actions/checkout@v6
      with:
        ref: ${{ github.event.workflow_run.head_sha }}

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'

    - name: Install uv
      uses: astral-sh/setup-uv@v8.1.0
      with:
        version: "0.13.6"

    - name: Generate API clients
      run: |
        ./scripts/generate-clients.sh

    - name: Build simulation API client from the entrypoint contract
      env:
        RUN_NUMBER: ${{ github.run_number }}
      run: .github/scripts/build-simulation-api-client.sh projects/policyengine-simulation-entry/artifacts/clients/python

    # PyPI trusted publishing: uploads accepted only from this workflow in the
    # pypi environment (limited to main). No stored token.
    - name: Publish simulation API client to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: projects/policyengine-simulation-entry/artifacts/clients/python/dist/

[project]
name = "policyengine-stage12-client"
version = "0.1.0"
readme = "README.md"
authors = [
    {name = "PolicyEngine", email = "hello@policyengine.org"},
]
license = {file = "../../LICENSE"}
requires-python = ">=3.13,<3.14"
dependencies = [
    "google-auth[requests]>=2,<3",
    "httpx>=0.28,<1",
    "policyengine-simulation-contract",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3.4",
    "pytest-cov>=6.1.1",
]
build = [
    "black>=25.1.0",
    "pyright>=1.1.401",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
sources = ["src"]
only-include = ["src/policyengine_stage12_client"]
packages = ["src/policyengine_stage12_client"]

[tool.uv.sources]
policyengine-simulation-contract = { path = "../policyengine-simulation-contract", editable = true }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

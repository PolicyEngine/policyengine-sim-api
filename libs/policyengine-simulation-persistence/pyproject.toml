[project]
name = "policyengine-simulation-persistence"
version = "0.1.0"
readme = "README.md"
authors = [
    {name = "PolicyEngine", email = "hello@policyengine.org"},
]
license = {file = "../../LICENSE"}
requires-python = ">=3.13,<3.14"
dependencies = [
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy>=2,<3",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3.4",
    "pytest-cov>=6.1.1",
]
build = [
    "pyright>=1.1.401",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
sources = ["src"]
only-include = ["src/policyengine_simulation_persistence"]
packages = ["src/policyengine_simulation_persistence"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.pyright]
# The pr.yml pyright job checks these paths: python -m scripts.rules pyright.
include = ["src"]

[project]
name = "policyengine-simulation-persistence"
version = "0.1.0"
readme = "README.md"
authors = [
    {name = "PolicyEngine", email = "hello@policyengine.org"},
]
license = {file = "../../LICENSE"}
requires-python = ">=3.13,<3.14"
dependencies = [
    # Report aggregates are validated by the contract's Pydantic models.
    "policyengine-simulation-contract",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2,<3",
    "sqlalchemy>=2,<3",
]

[project.optional-dependencies]
# The migration job installs Alembic; the Simulation Entrypoint runtime does not.
migrations = [
    "alembic>=1.16,<2",
]
test = [
    "alembic>=1.16,<2",
    "pytest>=8.3.4",
    "pytest-cov>=6.1.1",
    "pyyaml>=6.0.2",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
sources = ["src"]
only-include = ["src/policyengine_simulation_persistence"]
packages = ["src/policyengine_simulation_persistence"]

[tool.uv.sources]
policyengine-simulation-contract = { path = "../policyengine-simulation-contract", editable = true }
policyengine-simulation-observability = { path = "../policyengine-simulation-observability", editable = true }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "postgres: needs a disposable PostgreSQL server named by SIMULATION_TEST_DATABASE_URL",
]
